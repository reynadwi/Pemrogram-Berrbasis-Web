<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form dan Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center mt-5">
        <button type="button" class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#loginModal">
            Klik untuk Login
        </button>
    </div>

    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Formulir Login</h5>
                    <button type="button" class="btn-close" data-bs-dimis="modal" aria-label="close"></button>
                </div>

                <div class="modal-body">
                    <from>
                        <div class="mb-3">
                            <label for="emailInput" class="form-label">Alamat Email</label>
                            <input type="email" class="form-control" id="emailInput" placeholder="nama@email.com">
                        </div>
                        <div class="mb-3">
                            <label for="passwordInput" class="from-label">Password</label>
                            <input type="pasword" class="form-control" id="passwordInput">
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberCheck">
                            <label class="form-check-label" for="rememberCheck">Ingat saya</label>
                        </div>
                    </from>
                </div>

             <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dimiss="modal">Tutup</button>
                <button type="button" class="btn btn-primary">Login</button>
             </div>
            </div>
        </div>
    </div>
</body>
</html>
